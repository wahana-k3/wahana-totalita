<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#062E1C"/>
      <stop offset="60%" style="stop-color:#0A4A2E"/>
      <stop offset="100%" style="stop-color:#1a7a4a"/>
    </linearGradient>
    <radialGradient id="orb1" cx="80%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#C6621C;stop-opacity:.35"/>
      <stop offset="100%" style="stop-color:#C6621C;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="10%" cy="80%" r="35%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:.2"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>
  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Left accent bar -->
  <rect x="72" y="80" width="4" height="240" rx="2" fill="#4ade80" opacity=".8"/>
  <!-- Eyebrow -->
  <rect x="88" y="80" width="280" height="32" rx="16" fill="rgba(74,222,128,0.15)" stroke="rgba(74,222,128,0.3)" stroke-width="1"/>
  <text x="228" y="101" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="2">KEMNAKER RI · BNSP · YOGYAKARTA</text>
  <!-- Main title -->
  <text x="88" y="175" font-family="Arial Black,Arial,sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-1">Pelatihan Sertifikasi</text>
  <text x="88" y="250" font-family="Arial Black,Arial,sans-serif" font-size="62" font-weight="900" fill="#4ade80" letter-spacing="-1">K3 &amp; Lingkungan</text>
  <!-- Subtitle -->
  <text x="88" y="298" font-family="Arial,sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">Online &amp; Tatap Muka · 40+ Program · 1.200+ Alumni</text>
  <!-- Badge row -->
  <rect x="88" y="330" width="170" height="44" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="173" y="357" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">✓ KEMNAKER RI</text>
  <rect x="274" y="330" width="130" height="44" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="339" y="357" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">✓ BNSP</text>
  <rect x="420" y="330" width="150" height="44" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="495" y="357" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">✓ Sejak 2018</text>
  <!-- Brand -->
  <rect x="88" y="540" width="46" height="46" rx="10" fill="#C6621C"/>
  <text x="111" y="571" font-family="Arial Black,Arial,sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
  <text x="148" y="558" font-family="Arial Black,Arial,sans-serif" font-size="18" font-weight="900" fill="#ffffff">WAHANA TOTALITA KONSULTAN</text>
  <text x="148" y="578" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">wahanatotalita.com</text>
  <!-- Right visual: stat circles -->
  <circle cx="940" cy="315" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="940" cy="315" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="940" cy="315" r="80" fill="rgba(10,74,46,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="940" y="302" font-family="Arial Black,Arial,sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">1.200+</text>
  <text x="940" y="328" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)" text-anchor="middle">Peserta</text>
  <text x="940" y="344" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)" text-anchor="middle">Bersertifikasi</text>
  <!-- Floating cards -->
  <rect x="780" y="120" width="100" height="72" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="830" y="152" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">🦺</text>
  <text x="830" y="170" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">K3</text>
  <rect x="1060" y="130" width="100" height="72" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="1110" y="162" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">🌿</text>
  <text x="1110" y="180" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Lingkungan</text>
  <rect x="780" y="460" width="100" height="72" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="830" y="492" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">⛏️</text>
  <text x="830" y="510" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Mining</text>
  <rect x="1060" y="450" width="100" height="72" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="1110" y="482" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">⚙️</text>
  <text x="1110" y="500" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ISO/QHSE</text>
</svg>
